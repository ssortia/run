# Тесты, lint и debug-APK на каждый push в master и на каждый PR
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Новый push в ту же ветку отменяет прогон, который ещё идёт
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Кэш Gradle и проверка gradle-wrapper.jar. Кэш пишут только прогоны master,
      # PR его только читают, чтобы не вытеснять общий кэш
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # Android SDK на раннере уже есть (ANDROID_HOME), local.properties не нужен
      - name: Тесты, lint и сборка
        run: ./gradlew test lintDebug assembleDebug

      - name: Отчёты тестов и lint
        if: failure() || success()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Debug-APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
